services:
  mysql:
    image: mysql:latest
    container_name: hotel-managment-system
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "Hotel_Managment"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: caffine_and_redis
    ports:
      - "6379:6379"
      - "8001:8001"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: